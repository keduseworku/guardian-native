name: Native release checks
on:
  push:
    branches: [main, 'codex/**']
    tags: ['native-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade build "setuptools>=77" wheel ruff
      - run: python -m pip install --no-deps .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m build --no-isolation
      - run: python scripts/verify_artifact.py
      - run: python scripts/build_bundle.py
      - name: PowerShell install and remove in disposable personal homes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archive = Get-Item dist/guardian-native-1.0.0rc4-windows.zip
          Expand-Archive $Archive.FullName "$env:RUNNER_TEMP/guardian-bundle"
          $Bundle = "$env:RUNNER_TEMP/guardian-bundle/guardian-native-1.0.0rc4"
          & "$Bundle/scripts/Install-Guardian.ps1" -Python (Get-Command python).Source -GuardianHome "$env:RUNNER_TEMP/guardian-personal" -CodexHome "$env:RUNNER_TEMP/codex-personal"
          & "$Bundle/scripts/Uninstall-Guardian.ps1" -GuardianHome "$env:RUNNER_TEMP/guardian-personal"
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-native-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
