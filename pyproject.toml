[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-native"
version = "1.0.0rc4"
description = "Personal native-worktree acceptance and review for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kedus Eworku"}]
dependencies = []

[project.scripts]
guardian-native = "guardian_next.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardian_next = ["resources/*.md", "resources/pocock/*.md", "resources/pocock/*/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
